# Trial runner configuration: where things are, which env vars make which fault,
# and which strategy x fault cells to run. See docs/thesis-test-plan.md.

[cluster]
context = "k3s-dev"
prometheus = "https://prometheus.dev.internal"
ca_file = "docs/ca/dev-root-ca.crt" # relative to the repo root
poll_seconds = 2
timeout_minutes = 20

# One entry per app under test. kind decides how exposure is read:
# canary  -> weights in the VirtualService
# bluegreen -> which hash the active Service selects
# release is the env patch the runner rewrites to start a release.
[apps.demo]
kind = "canary"
namespace = "demo"
rollout = "demo"
virtual_service = "demo"
release = "gitops/apps/demo/base/release.yaml"

[apps.demo-bg]
kind = "bluegreen"
namespace = "demo-bg"
rollout = "demo-bg"
active_service = "demo-bg-active"
release = "gitops/apps/demo-bg/base/release.yaml"

# Every release runs the same healthy image; a fault is a set of env vars that
# the app reads at startup. [reset] is the healthy state between trials, and a
# fault overrides some of its values. Each APP_VERSION must differ from the
# reset's, or Git doesn't change and no rollout starts.
[reset]
APP_VERSION = "reset"
ERROR_RATE = "0"
LATENCY_MS = "0"
LATENCY_JITTER_MS = "0"
FAIL_READINESS = "false"
LEAK_MB_PER_MIN = "0"
WRONG_ANSWER = "false"

[faults]
f0 = { APP_VERSION = "f0-healthy" }
f1 = { APP_VERSION = "f1-err30", ERROR_RATE = "30" }
f2 = { APP_VERSION = "f2-err2", ERROR_RATE = "2" }
f3 = { APP_VERSION = "f3-lat800", LATENCY_MS = "800" }
f4 = { APP_VERSION = "f4-jit1500", LATENCY_JITTER_MS = "1500" }
f5 = { APP_VERSION = "f5-leak20", LEAK_MB_PER_MIN = "20" }
f6 = { APP_VERSION = "f6-notready", FAIL_READINESS = "true" }
f8 = { APP_VERSION = "f8-wrong", WRONG_ANSWER = "true" }

# F6 can hang: a leftover scale-down-deadline on an old ReplicaSet switches the
# progress deadline off (argo-rollouts #4971). Stop waiting after 4 min.
[timeouts]
f6 = 4

# The matrix: each mechanism on its own, plus the one combination per app
# whose parts cover each other's gaps. One run per cell, grouped by strategy.
#   demo (canary), components/<strategy>-*:
#     s0 control, s1 canary, s2 mirroring, s3 experiment (10%), s4 mirroring + canary (base)
#   demo-bg (blue-green), components/<strategy>-*:
#     b0 control, b1 post-promotion, b2 pre-promotion (load Job), b3 pre + post (base)
# F8 is left out: only the smoke test can catch it, and it isn't in any strategy now.
# Results of the first matrix (s0-s7, bg with the smoke test) are in results/v1/.

[[cells]]
strategy = "s0"
fault = "f0"

[[cells]]
strategy = "s0"
fault = "f1"

