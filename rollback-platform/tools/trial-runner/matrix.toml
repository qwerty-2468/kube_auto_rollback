# Follow-up (2026-11-08): S3 with the experiment at 10% per template, the same
# weight as the canary's first step, so S1 vs S3 isn't confounded by 10% vs 20%.
# F0 checks for false alarms at the lower traffic; F1-F5 are the faults E catches.

[[cells]]
strategy = "s3w10"
fault = "f0"

