# Lives in istio-system because the gateway pods read the secret from their own namespace.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: gateway-wildcard
  namespace: istio-system
spec:
  secretName: gateway-wildcard-tls
  duration: 2160h # 90d
  renewBefore: 720h # 30d
  dnsNames: [] # set per environment
  issuerRef:
    name: internal-ca
    kind: ClusterIssuer
