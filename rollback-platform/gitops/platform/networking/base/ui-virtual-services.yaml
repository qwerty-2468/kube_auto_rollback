# Kept in istio-system next to the Gateway, so they don't depend on the
# target namespaces existing when this app syncs (wave 3).
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: argocd
  namespace: istio-system
spec:
  hosts: [] # set per environment
  gateways: [main-gateway]
  http:
    - route:
        - destination:
            host: argocd-server.argocd.svc.cluster.local
            port: {number: 80}
---
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: rollouts-dashboard
  namespace: istio-system
spec:
  hosts: [] # set per environment
  gateways: [main-gateway]
  http:
    - route:
        - destination:
            host: argo-rollouts-dashboard.argo-rollouts.svc.cluster.local
            port: {number: 3100}
---
