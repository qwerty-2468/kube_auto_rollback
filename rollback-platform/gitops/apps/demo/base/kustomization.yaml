resources:
  - namespace.yaml
  - peer-authentication.yaml
  - services.yaml
  - virtual-service.yaml
  - analysis-template.yaml
  - mirror-analysis-template.yaml
  - experiment-analysis-template.yaml
  - rollout.yaml
  - loadgen.yaml
# The fault settings of the release (env vars); the trial runner rewrites it.
patches:
  - path: release.yaml
    target: { kind: Rollout, name: demo }
# The demo repo's CI rewrites newTag on every code release; Argo CD (main) picks it up.
images:
  - name: demo-app
    newName: prgdlv-auto.netbird.cloud:3000/admin/demo
    newTag: healthy-9850045-18
