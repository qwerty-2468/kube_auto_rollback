# Argo Rollouts points each Service at the matching ReplicaSet during a canary.
apiVersion: v1
kind: Service
metadata:
  name: demo-stable
  namespace: demo
spec:
  selector:
    app: demo
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: demo-canary
  namespace: demo
spec:
  selector:
    app: demo
  ports:
    - name: http
      port: 80
      targetPort: http
