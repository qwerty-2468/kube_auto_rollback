# S0, the control: no steps, no analysis. The new version gets 100% at once.
# Strategies and hypotheses: docs/thesis-test-plan.md, sections 2 and 4.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
patches:
  - target: {kind: Rollout, name: demo}
    patch: |-
      # No canary steps, so no background analysis: only this strategy's
      # own checks can stop the release.
      - op: remove
        path: /spec/strategy/canary/analysis
      - op: replace
        path: /spec/strategy/canary/steps
        value: []
