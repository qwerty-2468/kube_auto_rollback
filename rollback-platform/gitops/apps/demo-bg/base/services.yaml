# Argo Rollouts adds the pod-template-hash to each selector: active points at
# the version users get, preview at the new version waiting for promotion.
apiVersion: v1
kind: Service
metadata:
  name: demo-bg-active
  namespace: demo-bg
spec:
  selector:
    app: demo-bg
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: demo-bg-preview
  namespace: demo-bg
spec:
  selector:
    app: demo-bg
  ports:
    - name: http
      port: 80
      targetPort: http
