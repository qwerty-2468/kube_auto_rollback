resources:
  - ../../base
# The strategy under test: exactly one of b0-none ... b3-pre-post. The trial
# runner edits this line.
components:
  - ../../components/b3-pre-post
patches:
  - target: {kind: VirtualService, name: demo-bg}
    patch: |-
      - op: replace
        path: /spec/hosts
        value: [bg.dev.internal]
  - target: {kind: VirtualService, name: demo-bg-preview}
    patch: |-
      - op: replace
        path: /spec/hosts
        value: [bg-preview.dev.internal]
  - target: {kind: Deployment, name: loadgen}
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/env/0/value
        value: bg.dev.internal
