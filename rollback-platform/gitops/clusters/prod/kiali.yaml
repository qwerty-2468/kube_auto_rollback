apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kiali
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  project: default
  sources:
    - repoURL: https://kiali.org/helm-charts
      chart: kiali-server
      targetRevision: 2.33.0
      helm:
        releaseName: kiali
        valueFiles:
          - $values/gitops/platform/kiali/values.yaml
          - $values/gitops/platform/kiali/values-prod.yaml
    - repoURL: http://100.83.93.156:3000/admin/rollback-platform.git
      targetRevision: release
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: istio-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
