apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: grafana
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  project: default
  sources:
    - repoURL: https://grafana-community.github.io/helm-charts
      chart: grafana
      targetRevision: 13.7.0
      helm:
        releaseName: grafana
        valueFiles:
          - $values/gitops/platform/grafana/values.yaml
          - $values/gitops/platform/grafana/values-prod.yaml
    - repoURL: http://100.83.93.156:3000/admin/rollback-platform.git
      targetRevision: release
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
